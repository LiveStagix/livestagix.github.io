    <text x="922" y="120" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".7" fill="#cde2ff">LIVESTAGIX</text>
    <text x="884" y="442" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#cde2ff">STAY IN MOTION</text>
    <rect x="916" y="480" width="88" height="4" rx="2" fill="#f4f6ff"/>
