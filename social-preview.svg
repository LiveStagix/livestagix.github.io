    <text x="834" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#7f8daa">LIVESTAGIX</text>
    <text x="818" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".45" fill="#cde2ff">__LATEST_RELEASE__</text>
