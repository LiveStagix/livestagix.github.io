<header class="topbar">
  <a
    class="brand"
    href="/#top"
    aria-label="LiveStagix home"
    {% if page.active_nav == 'home' %}
      aria-current="page"
    {% endif %}
  >
    <span class="brand-mark" aria-hidden="true"
      ><img
        src="/public/Small%20round%20icon%20192.webp"
        alt="LiveStagix logo"
        width="192"
        height="192"
        decoding="async"
    /></span>
    <span class="brand-word"
      >LiveStagix<span class="brand-period">.</span><small>ANDROID WALLPAPER ENGINE</small></span
    >
  </a>
  <button
    class="menu-toggle"
    id="menu-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="primary-nav"
    aria-label="Open navigation"
  >
    <span></span><span></span>
  </button>
  <nav class="nav" id="primary-nav" aria-label="Primary navigation">
    <div class="nav-group" role="group" aria-label="Explore">
      <span class="nav-group-label">Explore</span>
      <a href="/#experience">Experience</a>
      <a href="/#features">Features</a>
      <a href="/#media-tuner">Media Tuner</a>
      <a
        href="/user-guide/"
        {% if page.active_nav == 'user-guide' %}
          aria-current="page"
        {% endif %}
        >User Guide</a
      >
      <a href="/#how-it-works">How it works</a>
      <a href="/#performance">The engine</a>
      <a href="/#faq">FAQ</a>
    </div>
    <div class="nav-group" role="group" aria-label="Project">
      <span class="nav-group-label">Project</span>
      <a
        href="https://livestagix.github.io/about/"
        {% if page.active_nav == 'about' %}
          aria-current="page"
        {% endif %}
        >About</a
      >
      <a
        href="https://livestagix.github.io/privacy-policy/"
        {% if page.active_nav == 'privacy' %}
          aria-current="page"
        {% endif %}
        >Privacy</a
      >
      <a
        href="https://livestagix.github.io/security/"
        {% if page.active_nav == 'security' %}
          aria-current="page"
        {% endif %}
        >Security</a
      >
      <a href="/#download">Download</a>
    </div>
  </nav>
  <a class="nav-cta" href="/#download"> Get the app <span aria-hidden="true">↗</span> </a>
</header>
