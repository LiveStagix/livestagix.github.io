name: Publish LiveStagix website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-stagix-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/public _site/privacy-policy
          cp index.html styles.css script.js logo.svg _site/
          cp privacy-policy/index.html _site/privacy-policy/index.html
          cp public/app-header-icon.png _site/app-header-icon.png
          cp "public/Round icon 144.webp" "public/Small round icon 192.webp" _site/public/

          # Generate a compact social preview from local artwork; no private release API is needed.
          python -m venv .venv-preview
          .venv-preview/bin/python -m pip install --disable-pip-version-check --quiet CairoSVG==2.7.1 Pillow==11.3.0
          .venv-preview/bin/python - <<'PY'
          import html
          from pathlib import Path

          import cairosvg
          from PIL import Image

          artwork = Path("social-preview.svg").read_text(encoding="utf-8")
          token = "__CHANNEL_LABEL__"
          if artwork.count(token) != 1:
              raise SystemExit("Expected one channel-label placeholder in social-preview.svg.")
          artwork = artwork.replace(token, html.escape("GOOGLE PLAY · CLOSED TEST", quote=False))

          raw_png = "/tmp/livestagix-social-preview-raw.png"
          cairosvg.svg2png(
              bytestring=artwork.encode("utf-8"),
              write_to=raw_png,
              output_width=1200,
              output_height=630,
          )

          # A 192-colour palette keeps the 1200x630 graphic sharp and lightweight.
          image = Image.open(raw_png).convert("RGB")
          image.quantize(
              colors=192,
              method=Image.Quantize.MEDIANCUT,
              dither=Image.Dither.FLOYDSTEINBERG,
          ).save("_site/social-preview.png", optimize=True)
          PY

          test -s _site/index.html
          test -s _site/privacy-policy/index.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/logo.svg
          test -s _site/app-header-icon.png
          test -s _site/social-preview.png
          test -s "_site/public/Round icon 144.webp"
          test -s "_site/public/Small round icon 192.webp"

      # The repository's Pages source is still branch-based. Keep the generated
      # preview in the source tree too, so the automatic Jekyll deployment
      # publishes the same image instead of overwriting it with a 404.
      - name: Track generated social preview for Pages
        shell: bash
        run: |
          set -euo pipefail
          if [ -f social-preview.png ] && cmp -s _site/social-preview.png social-preview.png; then
            echo "Social preview is already tracked at the current version."
            exit 0
          fi

          cp _site/social-preview.png social-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          if git diff --cached --quiet; then
            echo "No social preview change to commit."
            exit 0
          fi
          git commit -m "Track generated social preview image"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ github.token }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
