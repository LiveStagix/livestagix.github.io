name: Publish LiveStagix website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-stagix-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css script.js logo.svg _site/
          cp public/app-header-icon.png _site/app-header-icon.png
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/logo.svg
          test -s _site/app-header-icon.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ github.token }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4