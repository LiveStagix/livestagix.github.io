
name: Check website source formatting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livestagix-website-format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:
    name: Check HTML, CSS and JavaScript formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Prettier
        run: npm install --no-save --package-lock=false --ignore-scripts prettier@3.6.2 @shopify/prettier-plugin-liquid@1.11.3

      - name: Format approved HTML and Liquid files
        run: |
          ./node_modules/.bin/prettier --write \
            --config .prettierrc.json \
            --ignore-path .prettierignore \
            --plugin @shopify/prettier-plugin-liquid \
            --parser liquid-html \
            index.html \
            user-guide/index.html \
            about/index.html \
            privacy-policy/index.html \
            security/index.html \
            _includes/header.html \
            _includes/footer.html

      - name: Verify website source formatting
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --check \
            --config .prettierrc.json \
            --ignore-path .prettierignore \
            --plugin @shopify/prettier-plugin-liquid \
            --parser liquid-html \
            index.html \
            user-guide/index.html \
            about/index.html \
            privacy-policy/index.html \
            security/index.html \
            _includes/header.html \
            _includes/footer.html

          ./node_modules/.bin/prettier --check \
            --config .prettierrc.json \
            --ignore-path .prettierignore \
            styles.css \
            script.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit formatting changes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html user-guide/index.html about/index.html privacy-policy/index.html security/index.html _includes/header.html _includes/footer.html
          if ! git diff --cached --quiet; then
            git commit -m "Format website HTML and Liquid source"
            git push
          else
            echo "No formatting changes needed."
          fi
