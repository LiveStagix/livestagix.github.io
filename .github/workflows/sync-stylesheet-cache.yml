name: Sync stylesheet cache version

on:
  push:
    branches:
      - main
    paths:
      - styles.css
      - .github/workflows/sync-stylesheet-cache.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stylesheet-cache-version-main
  cancel-in-progress: false

jobs:
  sync:
    name: Generate and sync the CSS content version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate and push stylesheet references safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Stylesheet cache sync attempt $attempt/$max_attempts"

            # Always start from the latest remote main. The cache references are
            # generated files, so regenerate them instead of rebasing stale output.
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          css_path = Path("styles.css")
          if not css_path.is_file():
              raise SystemExit("styles.css was not found.")

          version = "sha256-" + sha256(css_path.read_bytes()).hexdigest()[:12]

          pages = {
              "index.html": ("styles.css", 2),
              "about/index.html": ("../styles.css", 1),
              "privacy-policy/index.html": ("../styles.css", 1),
              "security/index.html": ("../styles.css", 1),
              "user-guide/index.html": ("../styles.css", 1),
          }

          stylesheet_link = re.compile(
              r"""href=(?P<quote>["'])(?P<path>(?:[.][.]/)?styles[.]css)[?]v=[^"']+(?P=quote)"""
          )

          changed = []
          for filename, (expected_path, expected_count) in pages.items():
              page = Path(filename)
              if not page.is_file():
                  raise SystemExit(f"Required page is missing: {filename}")

              source = page.read_text(encoding="utf-8")
              matches = list(stylesheet_link.finditer(source))

              if len(matches) != expected_count:
                  raise SystemExit(
                      f"{filename}: expected {expected_count} stylesheet references, "
                      f"found {len(matches)}. No files were committed."
                  )

              wrong_paths = [
                  match.group("path")
                  for match in matches
                  if match.group("path") != expected_path
              ]
              if wrong_paths:
                  raise SystemExit(
                      f"{filename}: unexpected stylesheet path(s): {wrong_paths}"
                  )

              updated = stylesheet_link.sub(
                  lambda match: (
                      "href="
                      + match.group("quote")
                      + match.group("path")
                      + "?v="
                      + version
                      + match.group("quote")
                  ),
                  source,
              )

              if updated != source:
                  page.write_text(updated, encoding="utf-8", newline="")
                  changed.append(filename)

          print(f"Stylesheet content version: {version}")
          if changed:
              print("Updated pages:")
              for filename in changed:
                  print(f" - {filename}")
          else:
              print("All published pages already use the current stylesheet version.")
          PY

            git add index.html user-guide/index.html about/index.html privacy-policy/index.html security/index.html

            if git diff --cached --quiet; then
              echo "All published pages already use the current stylesheet version."
              exit 0
            fi

            version=$(python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          print("sha256-" + sha256(Path("styles.css").read_bytes()).hexdigest()[:12])
          PY
          )

            git commit -m "Sync stylesheet cache version to $version"

            if git push origin HEAD:main; then
              echo "Stylesheet cache references synchronized successfully."
              exit 0
            fi

            echo "Push rejected; another commit may have reached main."
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$((attempt * 2))"
            fi
          done

          echo "::error::Unable to sync stylesheet cache references after $max_attempts attempts."
          exit 1
