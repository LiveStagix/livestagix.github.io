name: Format website source

on:
  push:
    branches:
      - "format/**"

permissions:
  contents: write

concurrency:
  group: format-website-source
  cancel-in-progress: false

jobs:
  format:
    name: Format and validate website source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format source files
        run: |
          npx --yes prettier@3.6.2 --write \
            index.html \
            about/index.html \
            privacy-policy/index.html \
            security/index.html \
            styles.css \
            script.js

      - name: Validate formatted source
        run: |
          npx --yes prettier@3.6.2 --check \
            index.html \
            about/index.html \
            privacy-policy/index.html \
            security/index.html \
            styles.css \
            script.js
          node --check script.js
          git diff --check

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source files already follow the formatter."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html about/index.html privacy-policy/index.html security/index.html styles.css script.js
          git commit -m "Format website source for readability"
          git push origin HEAD
