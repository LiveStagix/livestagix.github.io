name: Publish VirusTotal scan status

on:
  workflow_dispatch:
  schedule:
    # Daily at 21:00 India Standard Time (15:30 UTC).
    - cron: "30 15 * * *"
  push:
    branches:
      - main
    paths:
      - "security/index.html"
      - ".github/scripts/virustotal_scan.py"
      - ".github/workflows/virustotal-scan.yml"

permissions:
  contents: write

concurrency:
  group: livestagix-virustotal-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Verify and scan latest official APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Validate scanner script syntax
        run: python3 -m py_compile .github/scripts/virustotal_scan.py

      - name: Validate Security page inline JavaScript
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("security/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim().length > 0);
          if (scripts.length === 0) throw new Error("No inline JavaScript found.");
          scripts.forEach((source, index) => new vm.Script(source, { filename: "security-inline-" + index + ".js" }));
          console.log("Validated " + scripts.length + " inline script(s).");
          NODE

      - name: Check whether VirusTotal API key is configured
        id: api-key
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [[ -n "$VT_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VirusTotal scanning is not configured. Add the VIRUSTOTAL_API_KEY Actions secret to enable automatic scans."
          fi

      - name: Verify APK, submit to VirusTotal and save report metadata
        if: steps.api-key.outputs.configured == 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: python3 .github/scripts/virustotal_scan.py

      - name: Publish scan metadata to the website repository
        if: success() && steps.api-key.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/scan-status.json
          if git diff --cached --quiet; then
            echo "No scan-status update to commit."
            exit 0
          fi
          git commit -m "Publish VirusTotal scan status"
          git push
